<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where the tools are used — Coastal Geohazards Experts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --ink:#0e2f36;
    --deep:#123b45;
    --tide:#3d7d8c;
    --sand:#f4efe4;
    --sand-line:#dcd3bd;
    --coral:#c1673b;
    --paper:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--sand);font-family:'Inter',sans-serif;color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;min-height:560px;}

  header{
    padding:18px 22px 14px;
    border-bottom:1px solid var(--sand-line);
    background:var(--paper);
  }
  header .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--tide);
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(20px,2.6vw,28px);
    margin:4px 0 4px;
    color:var(--deep);
  }
  header p{margin:0;font-size:13.5px;color:#4a5a5e;max-width:70ch;}

  #controls{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:12px 22px;
    background:var(--paper);
    border-bottom:1px solid var(--sand-line);
  }
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 12px;border-radius:999px;
    border:1px solid var(--sand-line);
    background:var(--sand);
    font-size:12.5px;font-weight:500;cursor:pointer;
    transition:background .15s, border-color .15s;
    user-select:none;
  }
  .chip:hover{border-color:var(--tide);}
  .chip.active{background:var(--deep);color:var(--paper);border-color:var(--deep);}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}

  #main{flex:1;display:flex;min-height:0;}
  #network{flex:1;background:#dfeaec;position:relative;overflow:hidden;}
  #networkSvg{width:100%;height:100%;}

  #sidebar{
    width:300px;flex:0 0 300px;
    background:var(--paper);
    border-left:1px solid var(--sand-line);
    overflow-y:auto;
    padding:14px 16px 30px;
  }
  #sidebar h2{
    font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--tide);margin:0 0 10px;
  }
  .entry{
    border:1px solid var(--sand-line);
    border-left:3px solid var(--coral);
    border-radius:4px;
    padding:10px 12px;
    margin-bottom:10px;
    background:var(--sand);
    cursor:pointer;
    transition:all .2s;
  }
  .entry:hover{border-left-color:var(--deep);background:#f9f6f0;}
  .entry.active{background:var(--deep);color:var(--paper);border-left-color:var(--coral);}
  .entry .tool{font-size:10.5px;font-family:'Space Mono',monospace;color:var(--tide);text-transform:uppercase;letter-spacing:.06em;}
  .entry.active .tool{color:var(--sand);}
  .entry .org{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;margin:2px 0 3px;color:var(--deep);}
  .entry.active .org{color:var(--paper);}
  .entry .purpose{font-size:12px;color:#4a5a5e;line-height:1.4;}
  .entry.active .purpose{color:#c8d0d4;}

  .date-badge{
    display:inline-block;font-family:'Space Mono',monospace;font-size:10.5px;
    color:var(--deep);background:var(--sand);border:1px solid var(--sand-line);
    border-radius:4px;padding:1px 7px;margin-left:6px;
  }
  .entry.active .date-badge{background:rgba(255,253,248,.2);color:var(--paper);border-color:rgba(255,253,248,.3);}

  svg .node-circle{
    stroke:#fffdf8;stroke-width:2px;
    cursor:pointer;
    transition:opacity .2s, filter .2s;
  }
  svg .node-circle:hover{filter:drop-shadow(0 0 8px rgba(14,47,54,.4));}
  svg .node-label{
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:600;
    text-anchor:middle;
    pointer-events:none;
    fill:var(--deep);
  }
  svg .link{
    stroke:var(--sand-line);
    stroke-width:1.5px;
    pointer-events:none;
  }
  svg .link.faded{opacity:.2;}

  @media (max-width:760px){
    #sidebar{display:none;}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="eyebrow">Coastal Geohazards Experts — impact network</div>
    <h1>Where the tools are used</h1>
    <p>CoastalME, ODSAS++, CliffMetrics and CESMapper in academic research, and public &amp; private sector coastal risk work. Click a node or list entry for details and a source link.</p>
  </header>

  <div id="controls"></div>

  <div id="main">
    <div id="network">
      <svg id="networkSvg"></svg>
    </div>
    <div id="sidebar">
      <h2>Entries — most recent first</h2>
      <div id="entryList"></div>
    </div>
  </div>

</div>

<script>
function initNetwork(){
/* ---------------------------------------------------------------
   DATA
   Each record is one confirmed instance of a tool being used.
   "date" is the reference/publication year of the source cited —
   it marks when that specific use was documented, not necessarily
   when the work took place. Replace/extend this array with your
   own verified entries. "contact" should be an institutional /
   public contact, not a scraped personal email — see the privacy
   note earlier in this conversation.
--------------------------------------------------------------- */
const TOOLS = {
  "CoastalME":  {color:"#123b45"},
  "ODSAS++":    {color:"#3d7d8c"},
  "CliffMetrics":{color:"#c1673b"},
  "CESMapper":  {color:"#8a7a4b"}
};

const DATA = [
  {
    tool:"CliffMetrics",
    org:"Environment Agency — NCERM2 programme",
    sector:"Public sector (government)",
    date:"2021",
    purpose:"Tool used to inform the National Coastal Erosion Risk Mapping programme (NCERM2), cited as a case study of operational research impact.",
    contact:"gov.uk FCERM research team",
    source:"https://environment.data.gov.uk/dataset/9fede91f-5acd-4fd2-9bd8-98153fa3c2ff"
  },
  {
    tool:"CoastalME",
    org:"University of Granada (IISTA) — ICCOAST project",
    sector:"Academic / publicly funded (Junta de Andalucía), Spain",
    date:"2025",
    purpose:"CoastalME (coupled with CSHORE) used to simulate hydro-morphodynamic evolution at Guainos Beach, Adra, as part of a probabilistic methodology projecting coastal erosion and flooding across Andalusian coast.",
    contact:"Corresponding author, Otiñar et al. 2025 — see source",
    source:"https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2025.1631041/full"
  },
  {
    tool:"CoastalME",
    org:"Happisburgh, Norfolk — cliff/beach research",
    sector:"Academic (UK)",
    date:"2020",
    purpose:"Original CoastalME case study site: 3D beach-thickness modelling to explain rapid cliff retreat after coastal-defence removal.",
    contact:"Corresponding authors of Payo et al., see source",
    source:"https://www.researchgate.net/publication/330904580_MODELLING_RAPID_COASTAL_CATCH-UP_AFTER_DEFENCE_REMOVAL_ALONG_THE_SOFT_CLIFF_COAST_OF_HAPPISBURGH_UK"
  },
  {
    tool:"CliffMetrics",
    org:"University of Vigo / Galician coast studies",
    sector:"Academic (Spain)",
    date:"2022",
    purpose:"CliffMetrics (SAGA GIS build) used as the comparison baseline while developing ODSAS on the Galician coast.",
    contact:"Gómez-Pazo et al., MDPI JMSE — corresponding author",
    source:"https://mdpi.com/2077-1312/10/1/26/htm"
  },
  {
    tool:"CliffMetrics",
    org:"St Bees Head / Flamborough Head, UK — model validation",
    sector:"Academic (UK)",
    date:"2018",
    purpose:"Original CliffMetrics v1.0 sensitivity and validation sites on the England coastline.",
    contact:"Payo et al., Geosci. Model Dev. 2018",
    source:"https://gmd.copernicus.org/articles/11/4317/2018/"
  },
  {
    tool:"ODSAS++",
    org:"Galician coast (NW Iberian Peninsula) — 10 study sites",
    sector:"Academic (Spain)",
    date:"2022",
    purpose:"ODSAS v1.0 developed and benchmarked against DSAS across ten Galician sites spanning sandy and granite-cliff coastlines.",
    contact:"Gómez-Pazo, A.; Payo, A. — MDPI JMSE 2022",
    source:"https://mdpi.com/2077-1312/10/1/26/htm"
  },
  {
    tool:"CliffMetrics",
    org:"Office of Public Works (OPW), Ireland",
    sector:"Public sector (government, Ireland)",
    date:"2026",
    purpose:"CliffMetrics automatically extracts the cliff-top line from LiDAR data, giving OPW a consistent, repeatable way to measure and track coastal cliff erosion across Ireland (OPW, 2026, Coastal Change programme).",
    contact:"Office of Public Works — opw.ie",
    source:"https://www.gov.ie/en/office-of-public-works/frm-pages/coastal-change/#national-coastal-erosion-hazard-mapping"
  },
  {
    tool:"CliffMetrics",
    org:"Environment Agency — NCERM2 programme",
    sector:"Public sector (government)",
    date:"To verify",
    purpose:"Tool used to inform the National Coastal Erosion Risk Mapping programme (NCERM2), cited as a case study of operational research impact.",
    contact:"gov.uk FCERM research team",
    source:"https://www.gov.uk/guidance/updates-to-national-flood-and-coastal-erosion-risk-information#new-national-coastal-erosion-risk-map-ncerm"
  },
  {
    tool:"CESMapper",
    org:"University College London (UCL) — iCOASST project",
    sector:"Academic / publicly funded (NERC, UK)",
    date:"2016",
    purpose:"CESMapper used to produce Coastal and Estuarine System Maps for the Deben estuary and adjoining Suffolk coast, one of two national iCOASST demonstration sites showing the CESM conceptual framework in practice.",
    contact:"UCL Coastal & Estuarine Research Unit — see source",
    source:"https://coastalmonitoring.org/ccoresources/iCOASST/CESM/"
  },
  {
    tool:"CESMapper",
    org:"University College London (UCL) — iCOASST project",
    sector:"Academic / publicly funded (NERC, UK)",
    date:"2016",
    purpose:"Second national iCOASST demonstration site: CESM system maps produced for Liverpool Bay (Sefton to Blackpool frontage) alongside the Suffolk coast application.",
    contact:"UCL Coastal & Estuarine Research Unit — see source",
    source:"https://coastalmonitoring.org/ccoresources/iCOASST/CESM/"
  }
];

// ---- build controls (tool filter chips) ----
const controls = document.getElementById('controls');
const activeTools = new Set(Object.keys(TOOLS));

function renderChips(){
  controls.innerHTML = '';
  Object.entries(TOOLS).forEach(([name,cfg])=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeTools.has(name) ? ' active' : '');
    chip.innerHTML = `<span class="dot" style="background:${cfg.color}"></span>${name}`;
    chip.onclick = () => {
      activeTools.has(name) ? activeTools.delete(name) : activeTools.add(name);
      renderChips();
      renderAll();
    };
    controls.appendChild(chip);
  });
}

// ---- D3 Network Graph ----
const svg = d3.select('#networkSvg');
const container = document.getElementById('network');
let width = container.clientWidth;
let height = container.clientHeight;

const g = svg.append('g');
let selectedNode = null;
const sidebarList = document.getElementById('entryList');

function sortByDateDesc(list){
  return [...list].sort((a, b) => {
    const yearOf = (s) => { const m = /\d{4}/.exec(s || ''); return m ? parseInt(m[0], 10) : -1; };
    return yearOf(b.date) - yearOf(a.date);
  });
}

function renderAll(){
  g.selectAll('*').remove();

  const filtered = sortByDateDesc(DATA.filter(d => activeTools.has(d.tool)));
  
  // Build nodes: one per tool + one per org
  const toolNodes = new Map();
  const orgNodes = new Map();
  const nodeArray = [];
  const linkArray = [];

  // Add tool nodes
  Object.keys(TOOLS).forEach(tool => {
    if (filtered.some(d => d.tool === tool)){
      toolNodes.set(tool, { id: tool, type: 'tool', label: tool, color: TOOLS[tool].color, size: 24 });
      nodeArray.push(toolNodes.get(tool));
    }
  });

  // Add org nodes and create links
  const orgCounts = {};
  filtered.forEach(d => {
    if (!orgNodes.has(d.org)){
      const count = (orgCounts[d.tool] = (orgCounts[d.tool] || 0) + 1);
      orgNodes.set(d.org, { id: d.org, type: 'org', label: d.org, tool: d.tool, color: TOOLS[d.tool].color, size: 10 });
      nodeArray.push(orgNodes.get(d.org));
    }
    linkArray.push({ source: d.tool, target: d.org });
  });

  // Create simulation
  const simulation = d3.forceSimulation(nodeArray)
    .force('link', d3.forceLink(linkArray)
      .id(d => d.id)
      .distance(d => d.source.type === 'tool' ? 80 : 40)
      .strength(.5))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => d.size + 20));

  // Draw links
  const link = g.selectAll('.link')
    .data(linkArray)
    .enter()
    .append('line')
    .attr('class', 'link')
    .attr('stroke', d => TOOLS[d.source.id].color)
    .attr('opacity', .3);

  // Draw nodes
  const node = g.selectAll('.node')
    .data(nodeArray)
    .enter()
    .append('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', dragStarted)
      .on('drag', dragged)
      .on('end', dragEnded));

  node.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => d.size)
    .attr('fill', d => d.color)
    .on('click', (e, d) => {
      if (d.type === 'org'){
        const entry = filtered.find(x => x.org === d.id);
        if (entry) selectEntry(entry, node);
      }
    });

  node.append('text')
    .attr('class', 'node-label')
    .attr('dy', '.3em')
    .text(d => {
      if (d.type === 'tool') return d.label;
      // Abbreviate org names for labels
      const parts = d.label.split('—')[0].trim().split(/\s+/);
      return parts.slice(0, 2).join(' ');
    })
    .style('font-size', d => d.type === 'tool' ? '12px' : '9px')
    .style('font-weight', d => d.type === 'tool' ? 700 : 500);

  // Render sidebar
  sidebarList.innerHTML = '';
  const dataByOrg = {};
  filtered.forEach(d => {
    if (!dataByOrg[d.org]) dataByOrg[d.org] = [];
    dataByOrg[d.org].push(d);
  });

  Object.values(dataByOrg).forEach(entries => {
    entries.forEach(d => {
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.dataset.org = d.org;
      entry.style.borderLeftColor = TOOLS[d.tool].color;
      entry.innerHTML = `<div class="tool">${d.tool}<span class="date-badge">${d.date}</span></div><div class="org">${d.org}</div><div class="purpose">${d.purpose}</div>`;
      entry.onclick = () => selectEntry(d, node, entry);
      sidebarList.appendChild(entry);
    });
  });

  function selectEntry(d, nodeSelection, entryEl){
    selectedNode = d.org;
    
    // Update sidebar
    document.querySelectorAll('.entry').forEach(el => el.classList.remove('active'));
    document.querySelectorAll(`[data-org="${d.org}"]`).forEach(el => el.classList.add('active'));
    
    // Highlight node
    nodeSelection.select('circle').attr('opacity', n => (n.id === d.org || n.id === d.tool) ? 1 : .3);
    link.attr('class', l => {
      const related = l.target.id === d.org;
      return related ? 'link' : 'link faded';
    });
  }

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  function dragStarted(e, d){
    if (!e.active) simulation.alphaTarget(.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }
  function dragged(e, d){
    d.fx = e.x;
    d.fy = e.y;
  }
  function dragEnded(e, d){
    if (!e.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }
}

// Handle window resize
window.addEventListener('resize', () => {
  width = container.clientWidth;
  height = container.clientHeight;
  svg.attr('width', width).attr('height', height);
  renderAll();
});

renderChips();
renderAll();
} // end initNetwork

initNetwork();
</script>
</body>
</html>
